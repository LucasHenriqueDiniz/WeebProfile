name: CI

# No path filter, unlike the workflow this replaces: a change in weeb-plugins can
# break weeb-dashboard's typecheck (they share types through dist/), and a change
# in the dashboard can break nothing in plugins but everything at build time. The
# only useful gate is the one that runs on every change.
on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Must come before typecheck. weeb-dashboard imports @weeb/weeb-plugins/*,
      # which resolves to dist/, so without this the type check runs against
      # whatever happens to be there -- or fails outright on a clean checkout.
      - name: Build weeb-plugins
        run: pnpm build:deps

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Named per package rather than `pnpm -r test`, so adding a package without
      # tests cannot quietly shrink what CI runs.
      - name: Tests (weeb-plugins)
        run: pnpm --filter @weeb/weeb-plugins test

      - name: Tests (weeb-dashboard)
        run: pnpm --filter weeb-dashboard test

      - name: Tests (svg-generator)
        run: pnpm --filter @weeb/svg-generator test

      # Catches what typecheck alone does not: bundler resolution, missing exports
      # from the package's exports map, and anything that only fails at build time.
      - name: Build dashboard
        run: pnpm build:dashboard

  plugins:
    name: Plugin metadata and previews
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate plugins
        working-directory: weeb-plugins
        run: pnpm validate

      - name: Generate types
        working-directory: weeb-plugins
        run: pnpm generate-types

      # Advisory: previews are generated out-of-band by the svg-generator, so a
      # missing one is a reminder rather than a reason to block a merge.
      - name: Validate section previews
        working-directory: weeb-plugins
        run: pnpm validate-previews --warn-only
        continue-on-error: true

      # Opção de config declarada que nenhum componente lê vira um campo no wizard
      # que aceita valor e não muda nada -- foi assim que o MyAnimeList ficou com um
      # "Title" decorativo. Advisory por enquanto: 7 casos herdados ainda esperam
      # decisão (implementar a leitura ou remover a opção). Vira gate quando zerar.
      - name: Validate config options
        working-directory: weeb-plugins
        run: pnpm validate-config-options --warn-only
        continue-on-error: true

  # O dashboard já sobe sozinho pela integração git do Cloudflare Pages; o gerador
  # é um Worker e ficava só no `wrangler deploy` manual. Isso criava uma janela em
  # que o dashboard, recém-deployado, chamava uma rota que o gerador ainda não tinha
  # -- aconteceu em 15/08/2026 com o /steam/resolve-vanity.
  deploy-generator:
    name: Deploy svg-generator
    runs-on: ubuntu-latest
    # Só main, e só depois dos testes passarem: o gerador não tem preview
    # environment, então o que sobe aqui é produção direto.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [quality, plugins]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # O worker importa @weeb/weeb-plugins pelo dist/, igual ao typecheck.
      - name: Build weeb-plugins
        run: pnpm build:deps

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: svg-generator
        # Os secrets do worker (STEAM_API_KEY, CRON_SECRET, SECRETS_ENCRYPTION_KEY)
        # não são tocados por um deploy: continuam os que já estão lá.
