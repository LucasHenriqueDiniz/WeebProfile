name = "weeb-svg-generator"
main = "src/worker.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# ============================================================
# Sem rota pública. POST / não tem autenticação e lê os secrets do
# usuário no D1 a partir do userId do body (ver src/worker.ts), então
# qualquer um com um userId do Clerk queimaria as API keys de terceiros.
#
# O dashboard chega aqui pelo service binding SVG_GENERATOR
# (weeb-dashboard/wrangler.toml), que não passa pela internet pública.
# Cron Triggers e service bindings não dependem de rota, então continuam
# funcionando. Dev local (`wrangler dev` em :3001) também não é afetado.
# ============================================================
workers_dev = false

# ============================================================
# D1 Database binding (read-only access to plugin_secrets)
# Same database as weeb-dashboard/wrangler.toml
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "weebprofile-db"
database_id = "c7eb434d-7ca2-4c5c-bf63-943e38e46158"

[[services]]
binding = "JIKAN_EDGE"
service = "jikan-edge"

# ============================================================
# Daily SVG regeneration (replaces the old GitHub Actions cron).
# Calls weeb-dashboard's /api/cron/generate-svgs on schedule; see
# the scheduled() handler in src/worker.ts.
# CRON_SECRET is set via `wrangler secret put CRON_SECRET` (not here).
# ============================================================
[triggers]
crons = ["7 3 * * *"]

[vars]
DASHBOARD_URL = "https://weebprofile-dashboard.pages.dev"
JIKAN_EDGE_BASE_URL = "https://jikan-edge.lucas-hdo.workers.dev"
