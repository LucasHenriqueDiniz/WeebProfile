name = "weeb-svg-generator"
main = "src/worker.ts"
# 2026-03-24 or later: Browser Run's quickAction (screenshots, below) needs it. Not
# later than 2026-06-10, the newest date the workerd bundled with wrangler 4.98 runs,
# or `wrangler dev` refuses to start.
compatibility_date = "2026-06-10"
compatibility_flags = ["nodejs_compat"]

# ============================================================
# Sem rota pública. POST / não tem autenticação e lê os secrets do
# usuário no D1 a partir do userId do body (ver src/worker.ts), então
# qualquer um com um userId do Clerk queimaria as API keys de terceiros.
#
# O dashboard chega aqui pelo service binding SVG_GENERATOR
# (weeb-dashboard/wrangler.toml), que não passa pela internet pública.
# Cron Triggers e service bindings não dependem de rota, então continuam
# funcionando. Dev local (`wrangler dev` em :3001) também não é afetado.
# ============================================================
workers_dev = false

# ============================================================
# Workers Logs. Without this block the Worker's console only reaches a live
# tail (`wrangler tail`), so a generation or cron failure left nothing to read
# the next morning. With it, every line src/utils/log.ts writes is kept --
# 3 days on Workers Free, 7 on Paid -- and can be filtered by its JSON fields
# (event, plugin, status) in the Cloudflare dashboard's Workers Logs.
# ============================================================
[observability]
enabled = true

# ============================================================
# D1 Database binding (read-only access to plugin_secrets)
# Same database as weeb-dashboard/wrangler.toml
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "weebprofile-db"
database_id = "c7eb434d-7ca2-4c5c-bf63-943e38e46158"

[[services]]
binding = "JIKAN_EDGE"
service = "jikan-edge"

# ============================================================
# Screenshots for the websites plugin (src/screenshots/site-screenshot.ts): Browser
# Run takes them, and they are kept in the dashboard's bucket under screenshots/ so a
# page is taken once a week, not on every daily generation. In `wrangler dev` the
# local Browser Run has no quickAction, so sites fall back to their preview image.
# ============================================================
[browser]
binding = "BROWSER"

[[r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "weebprofile-svgs"

# ============================================================
# Daily SVG regeneration.
# Calls weeb-dashboard's /api/cron/generate-svgs on schedule; see
# the scheduled() handler in src/worker.ts.
# CRON_SECRET is set via `wrangler secret put CRON_SECRET` (not here).
# ============================================================
[triggers]
crons = ["7 3 * * *"]

# ============================================================
# Secrets (via `wrangler secret put <KEY>`, never here):
#   CRON_SECRET             autentica a chamada ao endpoint de cron do dashboard
#   SECRETS_ENCRYPTION_KEY  decifra plugin_secrets (obrigatória, ver db/secret-crypto.ts)
#   STEAM_API_KEY           chave da aplicação para a Steam Web API, usada em nome de
#                           todos os usuários — ver db/app-credentials.ts. Sem ela o
#                           plugin Steam falha com mensagem de operador, e nenhum
#                           usuário consegue resolver sozinho.
#   GITHUB_PREVIEW_TOKEN    token clássico sem nenhum scope (só lê dado público),
#                           usado apenas no preview público da landing --
#                           ver previewCredentials em db/app-credentials.ts. Sem ele
#                           o preview do GitHub responde indisponível; o resto segue.
# ============================================================

[vars]
DASHBOARD_URL = "https://weebprofile-dashboard.pages.dev"
JIKAN_EDGE_BASE_URL = "https://jikan-edge.lucas-hdo.workers.dev"
